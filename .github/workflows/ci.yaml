name: My First Pipeline

on:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Build message
        run: echo "Build job is running"

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Test message
        run: echo "Test job is running"

  deploy:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Deploy message
        run: echo "Deploy job is running"